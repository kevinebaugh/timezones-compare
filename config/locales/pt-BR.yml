      hours_q: "De onde vem o horário de trabalho?"
      hours_a: "É a programação de notificações do Slack de cada pessoa. Para definir a sua, abra as Preferências do Slack, escolha Notificações e defina uma programação de notificações. Quem não tiver uma aparece com um aviso na linha."
      zone_q: "O fuso horário de alguém está errado"
      zone_a: "Os fusos horários vêm do perfil do Slack de cada pessoa. Depois que for corrigido no Slack, o quadro se atualiza na próxima vez que alguém abrir."
      fresh_q: "Quão atualizado está?"
      fresh_a: "Abrir um quadro atualiza tudo o que tiver mais de cinco minutos, e tudo se atualiza em segundo plano a cada hora."
      missing_q: "Por que alguém não aparece?"
      missing_a: "O quadro do workspace deixa de fora convidados, bots e quem não tem fuso horário no Slack. Os quadros de grupo espelham seus grupos de usuários do Slack, então mudanças feitas no Slack aparecem aqui."
      remove_q: "Como remover o app e excluir seus dados"
      remove_a_html: "Remova o timezones.compare em “Gerenciar apps” do Slack para revogar o acesso. Para excluir os dados armazenados, envie um e-mail para %{email}. A %{privacy_link} explica o que é guardado e por quanto tempo."
