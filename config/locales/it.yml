      zone_a: "I fusi orari arrivano dal profilo Slack di ogni persona. Una volta corretto in Slack, la bacheca si aggiorna la prossima volta che qualcuno la apre."
      fresh_q: "Quanto sono aggiornati i dati?"
      fresh_a: "Aprire una bacheca aggiorna tutto ciò che ha più di cinque minuti, e ogni ora tutto si aggiorna in background."
      missing_q: "Perché qualcuno non compare?"
      missing_a: "La bacheca dell’area di lavoro esclude ospiti, bot e chiunque non abbia un fuso orario in Slack. Le bacheche di gruppo rispecchiano i tuoi gruppi di utenti Slack, quindi le modifiche fatte in Slack compaiono anche qui."
      remove_q: "Rimuovere l’app ed eliminare i tuoi dati"
      remove_a_html: "Rimuovi timezones.compare da «Gestisci app» in Slack per revocarne l’accesso. Per far eliminare i dati memorizzati, scrivi a %{email}. L’%{privacy_link} spiega cosa viene conservato e per quanto tempo."
