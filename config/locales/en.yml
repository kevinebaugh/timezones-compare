      hours_a: "They're each person's Slack notification schedule. To set yours, open Slack's Preferences, choose Notifications, and set a notification schedule. Anyone without one gets a note on their row."
      zone_q: "Someone's time zone is wrong"
      zone_a: "Time zones come from each person's Slack profile. Once it's fixed in Slack, the board catches up the next time someone opens it."
      fresh_q: "How up to date is it?"
      fresh_a: "Opening a board refreshes anything older than five minutes, and everything refreshes in the background every hour."
      missing_q: "Why isn't someone listed?"
      missing_a: "The workspace board leaves out guests, bots and anyone without a time zone in Slack. Group boards mirror your Slack user groups, so changes made in Slack show up here."
      remove_q: "Removing the app and deleting your data"
      remove_a_html: "Remove timezones.compare under Slack's “Manage apps” to revoke its access. To have stored data deleted, email %{email}. The %{privacy_link} covers what's kept and for how long."
