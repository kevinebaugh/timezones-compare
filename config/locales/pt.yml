      zone_q: "O fuso horário de alguém está errado"
      zone_a: "Os fusos horários vêm do perfil do Slack de cada pessoa. Assim que for corrigido no Slack, o quadro atualiza-se da próxima vez que alguém o abrir."
      fresh_q: "Quão atualizado está?"
      fresh_a: "Abrir um quadro atualiza tudo o que tenha mais de cinco minutos, e tudo é atualizado em segundo plano a cada hora."
      missing_q: "Porque é que alguém não aparece?"
      missing_a: "O quadro do espaço de trabalho exclui convidados, bots e quem não tiver fuso horário no Slack. Os quadros de grupo refletem os seus grupos de utilizadores do Slack, por isso as alterações feitas no Slack aparecem aqui."
      remove_q: "Remover a aplicação e eliminar os seus dados"
      remove_a_html: "Remova o timezones.compare em «Gerir aplicações» no Slack para revogar o acesso. Para eliminar os dados guardados, envie um email para %{email}. A %{privacy_link} explica o que é guardado e durante quanto tempo."
