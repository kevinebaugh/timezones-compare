      install_a: "जब तक timezones.compare Slack Marketplace में लिस्टेड नहीं होता, Slack सिर्फ़ वर्कस्पेस के मालिकों को इसे इंस्टॉल करने देता है। अपने वर्कस्पेस के किसी मालिक से इसे इंस्टॉल करने को कहें। हो सकता है कि आपके संगठन की ऐप सेटिंग में भी इसकी अनुमति देनी पड़े।"
      hours_q: "काम के घंटे कहाँ से आते हैं?"
