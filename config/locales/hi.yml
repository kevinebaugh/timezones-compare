      zone_q: "किसी का टाइम ज़ोन गलत है"
      zone_a: "टाइम ज़ोन हर व्यक्ति की Slack प्रोफ़ाइल से आते हैं। Slack में ठीक होते ही, अगली बार कोई बोर्ड खोलेगा तो वह अपडेट हो जाएगा।"
      fresh_q: "डेटा कितना ताज़ा है?"
      fresh_a: "बोर्ड खोलने पर पाँच मिनट से पुरानी हर चीज़ रीफ़्रेश हो जाती है, और हर घंटे बैकग्राउंड में सब कुछ रीफ़्रेश होता है।"
      missing_q: "कोई व्यक्ति सूची में क्यों नहीं है?"
      missing_a: "वर्कस्पेस बोर्ड में मेहमान, बॉट और वे लोग शामिल नहीं होते जिनका Slack में टाइम ज़ोन नहीं है। ग्रुप बोर्ड आपके Slack यूज़र ग्रुप जैसे ही होते हैं, इसलिए Slack में किए गए बदलाव यहाँ भी दिखते हैं।"
