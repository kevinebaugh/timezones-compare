      remove_a_html: "इसकी एक्सेस वापस लेने के लिए Slack के “ऐप मैनेज करें” में जाकर timezones.compare को हटाएँ। सेव किया गया डेटा मिटवाने के लिए %{email} पर ईमेल करें। क्या रखा जाता है और कितने समय तक, यह %{privacy_link} में बताया गया है।"
