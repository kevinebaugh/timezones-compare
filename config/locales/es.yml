      hours_q: "¿De dónde sale el horario laboral?"
      hours_a: "Son el horario de notificaciones de Slack de cada persona. Para configurar el tuyo, abre las Preferencias de Slack, elige Notificaciones y configura un horario de notificaciones. Si alguien no tiene uno, aparece una nota en su fila."
      zone_q: "La zona horaria de alguien es incorrecta"
      zone_a: "Las zonas horarias vienen del perfil de Slack de cada persona. En cuanto se corrija en Slack, el tablero se pondrá al día la próxima vez que alguien lo abra."
      fresh_q: "¿Cómo de actualizado está?"
      fresh_a: "Al abrir un tablero se actualiza todo lo que tenga más de cinco minutos, y todo se actualiza en segundo plano cada hora."
      missing_q: "¿Por qué no aparece alguien?"
      missing_a: "El tablero del espacio de trabajo excluye a invitados, bots y a quien no tenga zona horaria en Slack. Los tableros de grupo reflejan tus grupos de usuarios de Slack, así que los cambios hechos en Slack se ven aquí."
      remove_q: "Desinstalar la aplicación y eliminar tus datos"
      remove_a_html: "Elimina timezones.compare en «Gestionar aplicaciones» de Slack para revocar su acceso. Para que se borren los datos almacenados, escribe a %{email}. La %{privacy_link} explica qué se guarda y durante cuánto tiempo."
