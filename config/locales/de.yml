      fresh_a: "Beim Öffnen eines Boards wird alles aktualisiert, was älter als fünf Minuten ist, und jede Stunde wird alles im Hintergrund aktualisiert."
      missing_q: "Warum fehlt jemand?"
      missing_a: "Das Workspace-Board lässt Gäste, Bots und alle ohne Zeitzone in Slack weg. Gruppen-Boards spiegeln deine Slack-Benutzergruppen, Änderungen in Slack erscheinen also auch hier."
