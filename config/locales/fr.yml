      zone_q: "Le fuseau horaire de quelqu’un est faux"
      zone_a: "Les fuseaux horaires proviennent du profil Slack de chaque personne. Une fois la correction faite dans Slack, le tableau se met à jour à sa prochaine ouverture."
      fresh_q: "Les données sont-elles à jour ?"
      fresh_a: "L’ouverture d’un tableau actualise tout ce qui date de plus de cinq minutes, et tout est actualisé en arrière-plan toutes les heures."
      missing_q: "Pourquoi quelqu’un n’apparaît-il pas ?"
      missing_a: "Le tableau de l’espace de travail exclut les invités, les bots et toute personne sans fuseau horaire dans Slack. Les tableaux de groupe reflètent vos groupes d’utilisateurs Slack : les modifications faites dans Slack apparaissent donc ici."
      remove_q: "Désinstaller l’application et supprimer vos données"
      remove_a_html: "Supprimez timezones.compare dans « Gérer les applications » de Slack pour révoquer son accès. Pour faire supprimer les données stockées, écrivez à %{email}. La %{privacy_link} précise ce qui est conservé et pendant combien de temps."
